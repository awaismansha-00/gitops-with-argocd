apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Prod overlay: more replicas, a pinned prod image tag, and a prod- name prefix.
resources:
  - ../../base
namePrefix: prod-
replicas:
  - name: myapp
    count: 3
images:
  - name: nginx
    newTag: 1.27.0
commonLabels:
  environment: prod
