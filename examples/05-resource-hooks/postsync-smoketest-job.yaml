# PostSync hook: runs AFTER all resources are applied and Healthy (e.g. smoke test).
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  template:
    metadata:
      name: smoke-test
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: busybox:1.36
          command: ["sh", "-c", "echo 'running smoke tests...'; sleep 3; echo passed"]
